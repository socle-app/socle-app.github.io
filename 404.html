<!doctype html>
<html lang="fr" data-accent="terracotta">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Socle — Bibliothèque de design</title>
  <meta name="description" content="Socle : composants, animations, sections et marques prêts à copier, en HTML/CSS et React.">
  <meta name="theme-color" content="#EFEFF2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#060010" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta property="og:title" content="Socle">
  <meta property="og:description" content="La bibliothèque de design : composants, animations, sections et marques.">
  <meta property="og:image" content="assets/og.png">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Socle">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="assets/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    /* Thème appliqué avant le premier rendu pour éviter le flash. */
    (function () {
      try {
        var t = localStorage.getItem('socle-theme');
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/brands-extra.css">
  <link rel="stylesheet" href="css/item-extra.css">
</head>
<body>
  <a class="skip" href="#contenu">Aller au contenu</a>
  <header class="bar" id="bar"></header>
  <div id="app"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">Socle a besoin de JavaScript pour afficher la bibliothèque.</p></noscript>
  <script src="data/logos-data.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
